<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>reply-overlay</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="panel" class="panel">
    <header class="field">
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 18.5 V8 a3 3 0 0 1 3 -3 h10 a3 3 0 0 1 3 3 v6 a3 3 0 0 1 -3 3 H8.5 Z"/>
        <path d="M9 11 h6"/>
      </svg>
      <input id="ask" type="text" autocomplete="off" spellcheck="false" aria-label="What do you want to say?"
             placeholder="What do you want to say?">
      <span id="context" class="context">Reading chat…</span>
    </header>
    <section id="body" class="body" hidden>
      <p class="label" id="draftLabel">Draft</p>
      <textarea id="draft" rows="1" spellcheck="false" aria-label="Draft reply"></textarea>
    </section>
    <footer class="footer">
      <span id="status"></span>
      <span id="keys" class="keys"></span>
    </footer>
  </main>
  <script src="panel.js"></script>
</body>
</html>
